Section "InputClass"
  Identifier     "GPD Pocket 3 touchpad"
  MatchProduct   "HAILUCK CO.,LTD USB KEYBOARD Mouse"
  MatchIsPointer "on"
  Driver         "libinput"
  Option         "AccelSpeed"      "1"
  Option         "MiddleEmulation" "1"
  Option         "ScrollButton"    "2"
  Option         "ScrollMethod"    "button"
EndSection

Section "InputClass"
  # generated by xinput_calibrator
  Identifier      "Stylus calibration"
  MatchProduct    "GXTP7380:00 27C6:0113 Stylus"
  Option  "MinX"  "20476"
  Option  "MaxX"  "20263"
  Option  "MinY"  "52124"
  Option  "MaxY"  "52237"
  Option  "SwapXY"        "1" # unless it was already set to 1
  Option  "InvertX"       "0"  # unless it was already set
  Option  "InvertY"       "0"  # unless it was already set
EndSection
